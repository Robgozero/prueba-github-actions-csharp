name: Prueba C#

on:
  push:
  workflow_dispatch:

jobs:
  prueba:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build Prueba.csproj

      - name: Ejecutar programa
        run: dotnet run --project Prueba.csproj
